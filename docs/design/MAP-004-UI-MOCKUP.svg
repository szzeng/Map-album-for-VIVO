<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">图迹 MAP-004 UI 样图</title>
  <desc id="desc">三种 Android 竖屏界面：地图主页收起、当前区域照片面板展开、聚合组照片面板。</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="9" y="9" width="332" height="692" rx="32"/></clipPath>
    <g id="mapBase">
      <rect x="9" y="9" width="332" height="692" fill="#EAF0E7"/>
      <path d="M-20 170 C45 140 86 160 132 198 S236 250 365 196" fill="none" stroke="#B9D9E9" stroke-width="28"/>
      <path d="M-15 285 C55 255 110 300 166 284 S270 244 360 286" fill="none" stroke="#FFFFFF" stroke-width="8"/>
      <path d="M30 -10 C75 80 95 155 124 244 S183 390 207 510 S260 650 280 710" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <path d="M-10 430 C70 398 145 424 205 405 S290 370 355 390" fill="none" stroke="#FFFFFF" stroke-width="6"/>
      <path d="M-10 555 L350 450 M-10 95 L350 155 M85 -10 L40 700 M250 -10 L320 700" fill="none" stroke="#D7D3C5" stroke-width="2.5"/>
      <path d="M15 345 L88 315 L114 350 L86 382 L24 382Z M230 320 L312 305 L332 355 L272 380 L230 355Z" fill="#DCE8D8"/>
      <path d="M25 455 L102 435 L119 477 L66 505 L18 490Z M214 510 L298 488 L325 535 L264 558 L212 542Z" fill="#DCE8D8"/>
      <g fill="#8A958E" font-family="Noto Sans CJK SC, sans-serif" font-size="9">
        <text x="36" y="126">滨河路</text><text x="205" y="178">城市公园</text>
        <text x="34" y="405">文化街</text><text x="245" y="435">中心大道</text>
        <text x="114" y="545">湖滨片区</text>
      </g>
    </g>
    <g id="brandCard">
      <rect x="20" y="49" width="310" height="58" rx="15" fill="#FFFFFF" filter="url(#shadow)"/>
      <rect x="29" y="60" width="36" height="36" rx="11" fill="#547C91"/>
      <path d="M47 67 C40 67 36 72 36 78 C36 85 47 91 47 91 S58 85 58 78 C58 72 54 67 47 67Z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="47" cy="78" r="3" fill="#FFFFFF"/>
      <text x="73" y="79" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#252B32">图迹</text>
      <text x="74" y="92" font-family="Arial, sans-serif" font-size="8" letter-spacing="1.2" fill="#7B858F">MAP ALBUM</text>
      <rect x="213" y="66" width="72" height="25" rx="12.5" fill="#EFF3F5"/>
      <text x="249" y="82" font-family="Noto Sans CJK SC, sans-serif" font-size="9" text-anchor="middle" fill="#547C91">样本 8 张</text>
      <circle cx="308" cy="78.5" r="16" fill="#F4F6F7"/>
      <circle cx="301" cy="78.5" r="1.6" fill="#53616A"/>
      <circle cx="308" cy="78.5" r="1.6" fill="#53616A"/>
      <circle cx="315" cy="78.5" r="1.6" fill="#53616A"/>
    </g>
    <g id="thumbA">
      <rect width="88" height="88" rx="7" fill="#AFC9CF"/>
      <circle cx="68" cy="20" r="10" fill="#EAD8A5"/>
      <path d="M0 63 L22 34 L43 58 L59 39 L88 68 V88 H0Z" fill="#789783"/>
      <path d="M0 73 L29 53 L48 68 L67 53 L88 70 V88 H0Z" fill="#527564"/>
    </g>
    <g id="thumbB">
      <rect width="88" height="88" rx="7" fill="#D5C7AD"/>
      <path d="M0 55 L24 29 L48 55 L64 38 L88 59 V88 H0Z" fill="#829C83"/>
      <path d="M0 72 L22 58 L44 68 L63 54 L88 73 V88 H0Z" fill="#5C7A69"/>
      <circle cx="68" cy="20" r="9" fill="#F1E1B7"/>
    </g>
    <g id="thumbC">
      <rect width="88" height="88" rx="7" fill="#B8C8D7"/>
      <path d="M0 58 L20 38 L40 52 L58 26 L88 60 V88 H0Z" fill="#839B92"/>
      <path d="M0 70 L27 56 L49 67 L72 49 L88 63 V88 H0Z" fill="#5B786E"/>
    </g>
    <g id="thumbD">
      <rect width="88" height="88" rx="7" fill="#C7CDB8"/>
      <rect x="17" y="25" width="54" height="45" rx="3" fill="#D9D0B7"/>
      <path d="M0 66 L24 46 L43 62 L62 43 L88 65 V88 H0Z" fill="#79927B"/>
      <path d="M0 75 L32 60 L53 73 L88 61 V88 H0Z" fill="#547565"/>
    </g>
    <g id="marker1">
      <rect x="0" y="0" width="52" height="52" rx="11" fill="#FFFFFF" filter="url(#shadow)"/>
      <g transform="translate(4 4) scale(.5)"><use href="#thumbA"/></g>
    </g>
    <g id="clusterMarker">
      <rect x="0" y="0" width="54" height="54" rx="11" fill="#FFFFFF" filter="url(#shadow)"/>
      <g transform="translate(3 3) scale(.545)"><use href="#thumbB"/></g>
      <rect x="30" y="35" width="22" height="16" rx="8" fill="#263A49"/>
      <text x="41" y="46.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">28</text>
    </g>
  </defs>

  <rect width="1200" height="860" fill="#F3F5F6"/>
  <text x="600" y="36" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#252B32">图迹 · MAP-004 正式 UI 样图</text>
  <text x="600" y="59" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#7B858F">地图优先 · 照片为主体 · 原生相册负责高清浏览</text>

  <!-- Screen 1: collapsed map -->
  <g transform="translate(25 82)">
    <rect width="350" height="710" rx="42" fill="#20262C"/>
    <g clip-path="url(#screenClip)">
      <use href="#mapBase"/>
      <rect x="9" y="9" width="332" height="692" fill="none"/>
      <text x="26" y="31" font-family="Arial, sans-serif" font-size="10" fill="#26323A">9:41</text>
      <rect x="143" y="17" width="64" height="17" rx="9" fill="#20262C"/>
      <g fill="none" stroke="#26323A" stroke-width="1.4"><path d="M293 25 h10 M293 25 l-2 -3 M293 25 l-2 3"/><path d="M307 21 v8 M311 19 v10 M315 17 v12"/></g>
      <use href="#brandCard"/>
      <g transform="translate(66 205)"><use href="#marker1"/></g>
      <g transform="translate(202 257)"><use href="#clusterMarker"/></g>
      <g transform="translate(105 390)"><use href="#marker1"/></g>
      <g transform="translate(258 434)"><use href="#clusterMarker"/></g>
      <circle cx="309" cy="503" r="23" fill="#FFFFFF" filter="url(#shadow)"/>
      <path d="M300 496 v-4 h4 M318 496 v-4 h-4 M300 510 v4 h4 M318 510 v4 h-4 M304 492 h10 M304 514 h10" fill="none" stroke="#547C91" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="9" y="548" width="332" height="153" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
      <rect x="151" y="559" width="30" height="4" rx="2" fill="#D5DCE0"/>
      <text x="25" y="589" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#252B32">当前地图范围</text>
      <text x="321" y="589" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#7B858F">8 张照片</text>
      <g transform="translate(24 603) scale(.68 .58)"><use href="#thumbA"/></g>
      <g transform="translate(99 603) scale(.68 .58)"><use href="#thumbB"/></g>
      <g transform="translate(174 603) scale(.68 .58)"><use href="#thumbC"/></g>
      <g transform="translate(249 603) scale(.68 .58)"><use href="#thumbD"/></g>
      <rect x="9" y="683" width="332" height="18" fill="#FFFFFF"/>
      <rect x="147" y="689" width="56" height="4" rx="2" fill="#252B32"/>
    </g>
  </g>

  <!-- Screen 2: expanded area sheet -->
  <g transform="translate(425 82)">
    <rect width="350" height="710" rx="42" fill="#20262C"/>
    <g clip-path="url(#screenClip)">
      <use href="#mapBase"/>
      <text x="26" y="31" font-family="Arial, sans-serif" font-size="10" fill="#26323A">9:41</text>
      <rect x="143" y="17" width="64" height="17" rx="9" fill="#20262C"/>
      <use href="#brandCard"/>
      <g transform="translate(72 184)"><use href="#marker1"/></g>
      <g transform="translate(220 208)"><use href="#clusterMarker"/></g>
      <rect x="9" y="264" width="332" height="437" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
      <rect x="151" y="276" width="30" height="4" rx="2" fill="#D5DCE0"/>
      <text x="25" y="306" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#252B32">当前地图范围</text>
      <text x="321" y="306" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#7B858F">8 张照片</text>
      <path d="M21 320 H329" stroke="#E9EDF0"/>
      <g transform="translate(22 334)"><use href="#thumbA"/></g>
      <g transform="translate(122 334)"><use href="#thumbB"/></g>
      <g transform="translate(222 334)"><use href="#thumbC"/></g>
      <g transform="translate(22 438)"><use href="#thumbD"/></g>
      <g transform="translate(122 438)"><use href="#thumbA"/></g>
      <g transform="translate(222 438)"><use href="#thumbB"/></g>
      <g transform="translate(22 542)"><use href="#thumbC"/></g>
      <g transform="translate(122 542)"><use href="#thumbD"/></g>
      <g transform="translate(222 542)"><use href="#thumbA"/></g>
      <g font-family="Noto Sans CJK SC, sans-serif" font-size="9" fill="#7B858F">
        <text x="22" y="431">11月24日</text><text x="122" y="431">11月23日</text><text x="222" y="431">11月22日</text>
        <text x="22" y="535">11月21日</text><text x="122" y="535">11月20日</text><text x="222" y="535">11月19日</text>
        <text x="22" y="639">11月18日</text><text x="122" y="639">11月17日</text><text x="222" y="639">11月16日</text>
      </g>
      <rect x="9" y="683" width="332" height="18" fill="#FFFFFF"/>
      <rect x="147" y="689" width="56" height="4" rx="2" fill="#252B32"/>
    </g>
  </g>

  <!-- Screen 3: selected cluster -->
  <g transform="translate(825 82)">
    <rect width="350" height="710" rx="42" fill="#20262C"/>
    <g clip-path="url(#screenClip)">
      <use href="#mapBase"/>
      <text x="26" y="31" font-family="Arial, sans-serif" font-size="10" fill="#26323A">9:41</text>
      <rect x="143" y="17" width="64" height="17" rx="9" fill="#20262C"/>
      <use href="#brandCard"/>
      <g transform="translate(92 180)"><use href="#marker1"/></g>
      <g transform="translate(210 190)"><use href="#clusterMarker"/></g>
      <rect x="9" y="300" width="332" height="401" rx="22" fill="#FFFFFF" filter="url(#shadow)"/>
      <rect x="151" y="312" width="30" height="4" rx="2" fill="#D5DCE0"/>
      <text x="25" y="342" font-family="Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#252B32">此处照片</text>
      <text x="321" y="342" text-anchor="end" font-family="Noto Sans CJK SC, sans-serif" font-size="11" fill="#7B858F">28 张</text>
      <rect x="22" y="354" width="92" height="25" rx="12.5" fill="#EFF3F5"/>
      <path d="M34 366 h9 m-4 -4 l-4 4 l4 4" stroke="#547C91" fill="none" stroke-width="1.4" stroke-linecap="round"/>
      <text x="76" y="370" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="10" fill="#547C91">返回当前区域</text>
      <path d="M21 389 H329" stroke="#E9EDF0"/>
      <g transform="translate(22 402)"><use href="#thumbB"/></g>
      <g transform="translate(122 402)"><use href="#thumbA"/></g>
      <g transform="translate(222 402)"><use href="#thumbC"/></g>
      <g transform="translate(22 506)"><use href="#thumbD"/></g>
      <g transform="translate(122 506)"><use href="#thumbB"/></g>
      <g transform="translate(222 506)"><use href="#thumbA"/></g>
      <g font-family="Noto Sans CJK SC, sans-serif" font-size="9" fill="#7B858F">
        <text x="22" y="499">11月24日</text><text x="122" y="499">11月23日</text><text x="222" y="499">11月22日</text>
        <text x="22" y="603">11月21日</text><text x="122" y="603">11月20日</text><text x="222" y="603">11月19日</text>
      </g>
      <text x="25" y="642" font-family="Noto Sans CJK SC, sans-serif" font-size="10" fill="#A0A8AE">按拍摄时间倒序排列</text>
      <rect x="9" y="683" width="332" height="18" fill="#FFFFFF"/>
      <rect x="147" y="689" width="56" height="4" rx="2" fill="#252B32"/>
    </g>
  </g>

  <g font-family="Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <text x="200" y="817" font-size="15" font-weight="700" fill="#252B32">01  地图主页 · 收起</text>
    <text x="200" y="838" font-size="11" fill="#7B858F">地图为主体，底部显示区域照片预览</text>
    <text x="600" y="817" font-size="15" font-weight="700" fill="#252B32">02  当前区域 · 展开</text>
    <text x="600" y="838" font-size="11" fill="#7B858F">三列照片网格，随地图视野同步更新</text>
    <text x="1000" y="817" font-size="15" font-weight="700" fill="#252B32">03  聚合组 · 照片</text>
    <text x="1000" y="838" font-size="11" fill="#7B858F">复用同一个面板，不另开弹窗</text>
  </g>
  <text x="600" y="856" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="9" fill="#9AA3AA">样本数量仅为示意；最终数值必须来自真实数据。尺寸按 dp 适配，不是设备截图。</text>
</svg>