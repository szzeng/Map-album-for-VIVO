plugins { id 'com.android.application' }
def localConfig = new Properties()
def localConfigFile = rootProject.file('local.properties')
if (localConfigFile.exists()) localConfigFile.withInputStream { localConfig.load(it) }
def baiduAk = localConfig.getProperty('baidu.map.ak', '').trim()
def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def arm64DebugOnly = providers.gradleProperty('mapAlbumArm64Only').map { it.toBoolean() }.getOrElse(false)
def sideBySideDebug = providers.gradleProperty('mapAlbumSideBySideDebug').map { it.toBoolean() }.getOrElse(false)
android {
    namespace 'io.github.szzeng.mapalbum'
    compileSdk 34
    defaultConfig { applicationId 'io.github.szzeng.mapalbum'; minSdk 29; targetSdk 34; versionCode 4; versionName '0.3.0' }
    buildFeatures { buildConfig true }
    signingConfigs {
        personalRelease {
            if (signingFile.exists()) {
                storeFile file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'PERSONAL_DEVICE_RELEASE', 'false'
            if (arm64DebugOnly) ndk.abiFilters 'arm64-v8a'
            if (sideBySideDebug) {
                applicationIdSuffix '.debug'
                manifestPlaceholders.mapAlbumLabel = '图迹 Debug'
            }
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.personalRelease
            buildConfigField 'boolean', 'PERSONAL_DEVICE_RELEASE', 'true'
        }
    }
    defaultConfig.manifestPlaceholders.baiduMapAk = baiduAk
    defaultConfig.manifestPlaceholders.mapAlbumLabel = '图迹'
    sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/map002')
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packagingOptions { jniLibs { keepDebugSymbols += '**/liblocSDK8b.so' } }
}
dependencies {
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Map:9.0.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Search:9.0.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Util:9.0.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Location:9.7.0'
}
tasks.register('reuseMap002Sources', Sync) {
    from('../../map002-provider-probe/src')
    include 'org/example/map002probe/PrimaryPhotoSource.java', 'org/example/map002probe/PrimitiveLocationSet.java', 'org/example/map002probe/ViewportFilter.java', 'org/example/map002probe/MapDataRepository.java', 'org/example/map002probe/MediaStoreLookup.java', 'org/example/map002probe/PhotoTimeline.java'
    into layout.buildDirectory.dir('generated/map002')
}
tasks.withType(JavaCompile).configureEach { dependsOn tasks.named('reuseMap002Sources') }

tasks.register('validateBaiduAk') {
    doLast {
        if (baiduAk.isEmpty()) throw new GradleException('请在 local.properties 中设置 baidu.map.ak 后构建百度地图应用')
    }
}
tasks.matching { it.name == 'preDebugBuild' || it.name == 'preReleaseBuild' }.configureEach { dependsOn tasks.named('validateBaiduAk') }
